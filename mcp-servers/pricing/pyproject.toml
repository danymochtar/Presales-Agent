[project]
name = "pricing-mcp"
version = "0.1.0"
description = "Azure Retail Prices API wrapper + FX helper for presales BOM"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
