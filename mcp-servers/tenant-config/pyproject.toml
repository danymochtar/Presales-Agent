[project]
name = "tenant-config-mcp"
version = "0.1.0"
description = "MCP server for per-tenant presales agent configuration"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
