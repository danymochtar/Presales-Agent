[project]
name = "inventory-parser-mcp"
version = "0.1.0"
description = "Parse RVTools / Azure Migrate / generic inventory into normalized workload schema"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pandas>=2.1",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
